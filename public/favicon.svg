<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" aria-label="Master Ball favicon">
  <defs>
    <clipPath id="ballClip">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
  </defs>
  <g shape-rendering="geometricPrecision">
    <!-- Ball body -->
    <circle cx="32" cy="32" r="28" fill="#ffffff" stroke="#111111" stroke-width="4"/>
    <g clip-path="url(#ballClip)">
      <!-- top half -->
      <rect x="0" y="0" width="64" height="32" fill="#6a35c4"/>
      <!-- pink side bumps -->
      <circle cx="18" cy="16" r="8" fill="#ef4ea0"/>
      <circle cx="46" cy="16" r="8" fill="#ef4ea0"/>
      <circle cx="15.5" cy="13.5" r="1.6" fill="#ffffff" opacity="0.9"/>
      <circle cx="43.5" cy="13.5" r="1.6" fill="#ffffff" opacity="0.9"/>
      <!-- middle seam -->
      <rect x="0" y="29" width="64" height="6" fill="#1a1a1a"/>
    </g>

    <!-- central button -->
    <circle cx="32" cy="32" r="7.2" fill="#ffffff" stroke="#111111" stroke-width="3"/>
    <circle cx="32" cy="32" r="3.4" fill="#f45ba9"/>

    <!-- Master Ball M -->
    <path d="M21 17 L21 26 L24 26 L24 20.5 L28 24 L32 20.5 L32 26 L35 26 L35 20.5 L39 24 L43 20.5 L43 26 L46 26 L46 17 L42.5 17 L37 21.5 L32 17.8 L27 21.5 L21.5 17 Z"
          fill="#ffffff"/>
  </g>
</svg>
