<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32.png?v=3"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=3"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2"
      crossorigin
    />
    <title>Personal Pokédex</title>
    <meta
      name="description"
      content="Sua jornada, sua Pokédex. Registre Pokémon capturados, busque por nome, número ou tipo e organize sua coleção pessoal com temas claro e escuro."
    />
    <meta
      name="theme-color"
      content="#f4f7f3"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#202824"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="canonical" href="https://personal-pokedex.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Personal Pokédex" />
    <meta property="og:title" content="Personal Pokédex" />
    <meta
      property="og:description"
      content="Cada Pokémon tem uma história. Registre suas capturas e organize sua coleção pessoal."
    />
    <meta property="og:url" content="https://personal-pokedex.vercel.app/" />
    <meta
      property="og:image"
      content="https://personal-pokedex.vercel.app/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Personal Pokédex — sua jornada, sua Pokédex, com uma Pokébola verde."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Personal Pokédex" />
    <meta
      name="twitter:description"
      content="Sua jornada, sua Pokédex. Registre suas capturas e organize sua coleção pessoal."
    />
    <meta
      name="twitter:image"
      content="https://personal-pokedex.vercel.app/social-card.png"
    />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("pokedex-go-theme");
        } catch {
          /* Use system preference. */
        }
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><p>
        Ative o JavaScript para registrar e consultar sua coleção. Os dados
        ficam salvos apenas neste navegador.
      </p></noscript
    >
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
